name: Karnataka HC Cause List Monitor

on:
  schedule:
    - cron: "0 18-22 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cause-list-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          python -m pip --version
          python -c "import playwright, pandas, bs4, rapidfuzz; print('Required Python packages: OK')"

      - name: Install Chromium and browser dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run parser compile check
        run: python -m py_compile monitor.py

      - name: Run local test mode
        run: python monitor.py --local-test

      - name: Run production monitor
        run: python monitor.py

      - name: Save/update result files
        run: |
          git status --short
          git add results/
          if git diff --cached --quiet; then
            echo "No result file changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update cause-list results"
          fi

      - name: Push updated results
        run: |
          git push